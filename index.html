<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madinaty Residence</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>
    <path fill='%23d4af37' d='M256 40L40 220h48v212h144V304h48v128h144V220h48L256 40z'/>
    <circle cx='390' cy='120' r='45' fill='%23d4af37'/>
    <text x='390' y='132' text-anchor='middle' font-size='42' fill='black'>$</text>
</svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #080808;
            --surface-color: #121212;
            --surface-hover: #1e1e1e;
            --gold-accent: #d4af37;
            --gold-hover: #b5952f;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --border-color: #2a2a2a;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            transition: direction 0.3s ease;
        }

        /* شريط التنقل */
        nav {
            padding: 20px 5%;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* اللوجو */
        .logo {
            font-size: 29px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: var(--gold-accent);
            font-size: 39px;
        }

        .logo span {
            color: var(--gold-accent);
        }

        /* زر تغيير اللغة */
        .lang-toggle {
            background: rgba(255, 255, 255, 0.1);
            color: var(--gold-accent);
            border: 1px solid var(--gold-accent);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-toggle:hover {
            background: var(--gold-accent);
            color: var(--bg-color);
        }

        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80') center/cover no-repeat;
            padding-top: 80px; 
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(8, 8, 8, 0.288) 0%, rgba(8,8,8,0.9) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 95%;
            max-width: 1200px;
            padding: 20px 0;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: -1px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.8);
            color: rgb(255, 191, 0);
        }

        .hero p {
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            color: white;
            margin-bottom: 50px;
        }

        .search-bar {
            background: rgba(18, 18, 18, 0.118);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 3px solid rgb(255, 191, 0);
            padding: 25px;
            border-radius: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            text-align: start; 
        }

        .filter-group label {
            font-size: 0.85rem;
            color: white;
            margin-bottom: 8px;
            font-weight: 900;
        }

        .filter-group select, .filter-group input {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.454);
            border: 1px solid rgba(255, 191, 0, 0.62);
            color: white;
            border-radius: 10px;
            outline: none;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .filter-group select:focus, .filter-group input:focus,
        .filter-group select:hover, .filter-group input:hover {
            border-color: var(--gold-accent);
            background: rgba(0, 0, 0, 0.8);
        }

        /* صورة خلفية العقار */
        .properties-wrapper {
            background: linear-gradient(to bottom, rgba(8,8,8,1) 0%, rgba(8,8,8,0.85) 20%, rgba(8,8,8,0.9) 100%), 
                        url('https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80') center/cover no-repeat fixed;
            position: relative;
            padding-top: 80px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 5% 80px 5%;
            position: relative;
            z-index: 2;
            flex-grow: 1;
        }

        .section-title {
            font-size: 2.2rem;
            margin-bottom: 40px;
            border-inline-start: 5px solid var(--gold-accent); 
            padding-inline-start: 20px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 35px;
        }

        .property-card {
            background: rgba(18, 18, 18, 0.85); 
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: var(--transition);
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
        }

        .property-card:hover {
            transform: translateY(-8px);
            border-color: var(--gold-accent);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.15);
            background: rgba(18, 18, 18, 0.95);
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 260px;
            overflow: hidden;
        }

        .slider {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        
        .slider::-webkit-scrollbar { display: none; }

        .slider img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
            scroll-snap-align: start;
            cursor: zoom-in;
            transition: transform 0.5s ease;
        }

        .slider img:hover { transform: scale(1.03); }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 2;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slider-btn:hover { 
            background: var(--gold-accent); 
            transform: translateY(-50%) scale(1.1);
        }
        
        [dir="rtl"] .prev-btn { right: 15px; }
        [dir="rtl"] .next-btn { left: 15px; }
        [dir="ltr"] .prev-btn { left: 15px; }
        [dir="ltr"] .next-btn { right: 15px; }

        .card-body { 
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .owner-info {
            background: rgba(255, 255, 255, 0.02);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }

        .owner-info div {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .owner-info i {
            color: var(--gold-accent);
            width: 16px;
            text-align: center;
        }

        .price {
            font-size: 1.8rem;
            color: var(--gold-accent);
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: baseline;
            gap: 5px;
        }
        
        .price span {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .location-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tag {
            background: rgba(212, 175, 55, 0.08);
            color: var(--gold-accent);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .specs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
            margin-bottom: 25px;
        }

        .spec-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .spec-item i { 
            color: var(--gold-accent); 
            font-size: 1.2rem;
            width: 25px;
            text-align: center;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 1rem;
        }

        .action-btn:hover {
            border-color: var(--gold-accent);
            background: rgba(212, 175, 55, 0.05);
        }

        .action-btn.whatsapp {
            background: var(--gold-accent);
            color: var(--bg-color);
            border-color: var(--gold-accent);
        }

        .action-btn.whatsapp:hover {
            background: var(--gold-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .action-btn.video {
            border-color: #e50914;
            color: #e50914;
        }

        .action-btn.video:hover {
            background: #e50914;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(229, 9, 20, 0.2);
        }

        /* ---------------- الفوتر الشفاف ---------------- */
        footer {
            /* تعديل الفوتر ليكون شفافاً ويظهر الخلفية تحته */
            background: rgba(8, 8, 8, 0);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            padding: 60px 20px;
            text-align: center;
            border-top: 3px solid rgb(255, 191, 0);
            position: relative;
            z-index: 2;
        }

        .dev-title {
            color: gold;
            margin-bottom: 40px;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .dev-title span {
            color: RED;
        }

        .developers {
            display: flex;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
        }

        .dev-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            transition: var(--transition);
        }

        .dev-profile:hover {
            transform: translateY(-10px);
        }

        .dev-profile img {
            width: 150px;
            height: 150px;
            border-radius: 30%;
            object-fit: cover;
            border: 3px solid var(--gold-accent);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.2);
            background: #1a1a1a;
        }

        .dev-profile p {
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--text-primary);
            font-size: 1.1rem;
        }

        /* ---------------- Lightbox ---------------- */
        .lightbox-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .lightbox-modal.active { opacity: 1; visibility: visible; }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            user-select: none;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            z-index: 100000;
            transition: color 0.3s ease;
        }
        
        [dir="ltr"] .lightbox-close { right: 30px; left: auto; }
        [dir="rtl"] .lightbox-close { left: 30px; right: auto; }

        .lightbox-close:hover { color: var(--gold-accent); }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox-nav:hover { background: var(--gold-accent); color: var(--bg-color); }
        [dir="rtl"] .lightbox-prev { right: 5%; } 
        [dir="rtl"] .lightbox-next { left: 5%; }
        [dir="ltr"] .lightbox-prev { left: 5%; } 
        [dir="ltr"] .lightbox-next { right: 5%; }
        
        .image-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        .skeleton {
            background: linear-gradient(90deg, var(--surface-color) 25%, var(--surface-hover) 50%, var(--surface-color) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }

        .skeleton-img { height: 260px; width: 100%; margin-bottom: 15px; border-radius: 16px 16px 0 0; }
        .skeleton-text { height: 20px; width: 50%; margin-bottom: 15px; }
        .skeleton-text.full { width: 100%; }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (max-width: 768px) {
            .hero { padding-top: 100px; }
            .hero h1 { font-size: 2.2rem; margin-bottom: 20px; }
            .search-bar { 
                grid-template-columns: 1fr 1fr; 
                padding: 15px; 
                gap: 15px;
            }
            .properties-grid { grid-template-columns: 1fr; }
            .lightbox-nav { width: 45px; height: 45px; font-size: 1.2rem; }
            .specs { grid-template-columns: 1fr; }
            .developers { gap: 30px; }
            nav { flex-direction: column; gap: 15px; padding-top: 15px;}
        }
        
        @media (max-width: 480px) {
            .search-bar { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="lightbox" class="lightbox-modal">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <button class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1)"><i class="fas fa-chevron-left" id="lb-prev-icon"></i></button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Full Screen Image">
        </div>
        <button class="lightbox-nav lightbox-next" onclick="navigateLightbox(1)"><i class="fas fa-chevron-right" id="lb-next-icon"></i></button>
        <div class="image-counter" id="lightbox-counter">1 / 1</div>
    </div>

    <header class="hero">
        <nav>
            <div class="logo">
                <i class="fas fa-city"></i>
                <div>Madinaty <span>Residence</span></div>
            </div>
            <button class="lang-toggle" onclick="toggleLang()">
                <i class="fas fa-globe"></i> <span id="lang-text">العربية</span>
            </button>
        </nav>
        <div class="hero-content">
            <h1 id="hero-title">Apartments for Rent in Madinaty</h1>
            <p id="hero-desc">Discover luxury and elegance in an integrated residential environment</p>

            <div class="search-bar">
                <div class="filter-group">
                    <label id="lbl-phase">Phase</label>
                    <select id="phase-filter"></select>
                </div>
                <div class="filter-group">
                    <label id="lbl-floor">Floor</label>
                    <select id="floor-filter"></select>
                </div>
                <div class="filter-group">
                    <label id="lbl-rooms">Bedrooms</label>
                    <select id="rooms-filter"></select>
                </div>
                <div class="filter-group">
                    <label id="lbl-baths">Bathrooms</label>
                    <select id="baths-filter"></select>
                </div>
                <div class="filter-group">
                    <label id="lbl-area">Apartment Area (Approx)</label>
                    <input type="number" id="area-filter" placeholder="e.g., 140">
                </div>
                <div class="filter-group">
                    <label id="lbl-price">Max Rent Price</label>
                    <input type="number" id="price-filter" placeholder="e.g., 30000">
                </div>
            </div>
        </div>
    </header>

    <section class="properties-wrapper">
        <main class="container">
            <h2 class="section-title" id="section-title">Latest Available Offers</h2>
            <div id="properties-grid" class="properties-grid">
                </div>
        </main>

      <footer>
    <h3 class="dev-title" id="dev-title"><span>|</span> Developed By <span>|</span></h3>
    
    <div class="developers">

        <div class="dev-profile">
            <img src="1.jpeg" alt="Abdelrahman Hamouda">
            <p>ABDELRAHMAN HAMOUDA</p>
        </div>

        <div class="dev-profile">
            <img src="2.jpeg" alt="Mahmoud Salah">
            <p>MAHMOUD SALAH</p>
        </div>

    </div>
</footer>
    </section>

    <script>
        // ---------------- قاموس الترجمة (عربي - إنجليزي) ----------------
        const i18n = {
            ar: {
                langBtn: "English",

                lblRooms: "Bedrooms",

                lblArea: "Apartment Area (Approx)",

                sectionTitle: "Latest Available Offers",
                owner: "Owner:",

                phase: "Phase",
                group: "Group",

                rooms: "Beds",
                baths: "Baths",
                area: "m²",
                videoBtn: "Watch Video",
                waBtn: "Contact via WhatsApp",
                noData: "No properties match your current search criteria.",
                error: "An error occurred while fetching data. Please check your connection and refresh.",
                waMsg: "Hello, I am inquiring about the apartment for rent in Madinaty",
                waPhase: "Phase",
                waGroup: "Group",
                waFloor: "Floor",
                waPrice: "at a price of",
                devTitle: "<span>|</span> Developed By <span>|</span>"
            }
        };

        // اللغة الافتراضية أصبحت الإنجليزية
        let currentLang = 'en'; 
        let allProperties = [];
        let galleries = {}; 
        let currentGalleryKey = null;
        let currentImageIndex = 0;

        // عناصر الـ DOM
        const gridContainer = document.getElementById('properties-grid');
        const phaseFilter = document.getElementById('phase-filter');
        const floorFilter = document.getElementById('floor-filter');
        const roomsFilter = document.getElementById('rooms-filter');
        const bathsFilter = document.getElementById('baths-filter');
        const areaFilter = document.getElementById('area-filter');
        const priceFilter = document.getElementById('price-filter');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCounter = document.getElementById('lightbox-counter');

        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = currentLang;

            document.getElementById('lb-prev-icon').className = currentLang === 'ar' ? 'fas fa-chevron-right' : 'fas fa-chevron-left';
            document.getElementById('lb-next-icon').className = currentLang === 'ar' ? 'fas fa-chevron-left' : 'fas fa-chevron-right';

            updateStaticText();
            generateDynamicFilters(); 
            filterProperties(); 
        }

        function updateStaticText() {
            const t = i18n[currentLang];
            document.getElementById('lang-text').innerText = t.langBtn;
            document.getElementById('hero-title').innerText = t.heroTitle;
            document.getElementById('hero-desc').innerText = t.heroDesc;
            document.getElementById('lbl-phase').innerText = t.lblPhase;
            document.getElementById('lbl-floor').innerText = t.lblFloor;
            document.getElementById('lbl-rooms').innerText = t.lblRooms;
            document.getElementById('lbl-baths').innerText = t.lblBaths;
            document.getElementById('lbl-area').innerText = t.lblArea;
            document.getElementById('lbl-price').innerText = t.lblPrice;
            document.getElementById('area-filter').placeholder = t.phArea;
            document.getElementById('price-filter').placeholder = t.phPrice;
            document.getElementById('section-title').innerText = t.sectionTitle;
            document.getElementById('dev-title').innerHTML = t.devTitle;
        }

        function showSkeletons() {
            gridContainer.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                gridContainer.innerHTML += `
                    <div class="property-card">
                        <div class="skeleton skeleton-img"></div>
                        <div class="card-body">
                            <div class="skeleton skeleton-text"></div>
                            <div class="skeleton skeleton-text full" style="margin-top: 15px;"></div>
                            <div class="skeleton skeleton-text full"></div>
                        </div>
                    </div>
                `;
            }
        }

        function generateDynamicFilters() {
            const t = i18n[currentLang];
            
            const selPhase = phaseFilter.value;
            const selFloor = floorFilter.value;
            const selRooms = roomsFilter.value;
            const selBaths = bathsFilter.value;

            const uniquePhases = [...new Set(allProperties.map(item => item.phase).filter(v => v))];
            const uniqueFloors = [...new Set(allProperties.map(item => item.floor).filter(v => v))];
            const uniqueRooms = [...new Set(allProperties.map(item => item.bedrooms).filter(v => v))];
            const uniqueBaths = [...new Set(allProperties.map(item => item.bathrooms).filter(v => v))];

            phaseFilter.innerHTML = `<option value="all">${t.all}</option>`;
            uniquePhases.sort().forEach(phase => {
                phaseFilter.innerHTML += `<option value="${phase}">${phase}</option>`;
            });

            floorFilter.innerHTML = `<option value="all">${t.all}</option>`;
            uniqueFloors.sort((a,b) => String(a).localeCompare(String(b), undefined, {numeric: true})).forEach(floor => {
                floorFilter.innerHTML += `<option value="${floor}">${floor}</option>`;
            });

            roomsFilter.innerHTML = `<option value="all">${t.all}</option>`;
            uniqueRooms.sort((a,b) => a - b).forEach(room => {
                roomsFilter.innerHTML += `<option value="${room}">${room} ${t.rooms}</option>`;
            });

            bathsFilter.innerHTML = `<option value="all">${t.all}</option>`;
            uniqueBaths.sort((a,b) => a - b).forEach(bath => {
                bathsFilter.innerHTML += `<option value="${bath}">${bath} ${t.baths}</option>`;
            });

            if(selPhase) phaseFilter.value = selPhase;
            if(selFloor) floorFilter.value = selFloor;
            if(selRooms) roomsFilter.value = selRooms;
            if(selBaths) bathsFilter.value = selBaths;
        }

        async function fetchProperties() {
            // تحديث النصوص للحالة الإنجليزية بمجرد تحميل الصفحة
            updateStaticText();
            showSkeletons();
            
            try {
                const response = await fetch("https://script.google.com/macros/s/AKfycbwxn6xLkLVeCyxUb6vu1Nj-dhowvvDP9fG_eZwNcuOe-IlCjeFAozOylVPtjVEVw6Q-8g/exec");
                const data = await response.json();
                
                allProperties = data;

                generateDynamicFilters();
                renderProperties(allProperties);

            } catch (error) {
                const t = i18n[currentLang];
                gridContainer.innerHTML = `<div style="text-align: center; width: 100%; grid-column: 1/-1;"><i class="fas fa-exclamation-triangle" style="font-size:3rem; color:#e50914; margin-bottom:15px;"></i><p style="color: var(--text-secondary);">${t.error}</p></div>`;
                console.error("Fetch Error: ", error);
            }
        }

        function renderProperties(properties) {
            const t = i18n[currentLang];
            gridContainer.innerHTML = '';

            if (!properties || properties.length === 0) {
                gridContainer.innerHTML = `<div style="text-align: center; width: 100%; grid-column: 1/-1; padding: 50px 0;"><i class="fas fa-search" style="font-size:3rem; color:var(--gold-accent); margin-bottom:15px;"></i><p style="color: var(--text-secondary); font-size:1.2rem;">${t.noData}</p></div>`;
                return;
            }

            properties.forEach((prop, index) => {
                let imagesArray = [];

                if (Array.isArray(prop.apartmentImages)) {
                    imagesArray.push(...prop.apartmentImages);
                }
                if (Array.isArray(prop.viewImages)) {
                    imagesArray.push(...prop.viewImages);
                }
                if (imagesArray.length === 0) {
                    imagesArray = ["https://via.placeholder.com/800x600/121212/d4af37?text=No+Image+Available"];
                }

                const galleryKey = `prop_${index}`;
                galleries[galleryKey] = imagesArray;

                const imagesHTML = imagesArray.map((img, idx) => `
                    <img 
                        src="${img}" 
                        alt="Property Image"
                        loading="lazy"
                        referrerpolicy="no-referrer"
                        onclick="openLightbox('${galleryKey}', ${idx})"
                    >
                `).join('');
                
                const sliderNav = imagesArray.length > 1 ? `
                    <button class="slider-btn prev-btn" onclick="scrollSlider(this, -1)"><i class="fas fa-chevron-${currentLang === 'ar' ? 'right' : 'left'}"></i></button>
                    <button class="slider-btn next-btn" onclick="scrollSlider(this, 1)"><i class="fas fa-chevron-${currentLang === 'ar' ? 'left' : 'right'}"></i></button>
                ` : '';

                const phone = "201559488649";
                const waMessage = encodeURIComponent(`${t.waMsg} (${t.waPhase} ${prop.phase} - ${t.waGroup} ${prop.group} - ${t.waFloor} ${prop.floor || '-'}) ${t.waPrice} ${prop.price}`);

                const videoBtnHTML = prop.video ? `
                    <a href="${prop.video}" target="_blank" class="action-btn video">
                        <i class="fas fa-play-circle"></i> ${t.videoBtn}
                    </a>
                ` : '';

                const cardHTML = `
                    <div class="property-card">
                        <div class="slider-container">
                            ${sliderNav}
                            <div class="slider" dir="ltr">
                                ${imagesHTML}
                            </div>
                        </div>
                        <div class="card-body">
                            
                            <div class="owner-info">
                                <div><i class="fas fa-user"></i> <strong>${t.owner}</strong> ${prop.name || t.notAvailable}</div>
                            </div>
                            
                            <div class="price">${Number(prop.price).toLocaleString()} <span>${t.currency}</span></div>
                            
                            <div class="location-tags">
                                <span class="tag">${t.phase} ${prop.phase || '-'}</span>
                                <span class="tag">${t.group} ${prop.group || '-'}</span>
                            </div>

                            <div class="specs">
                                <div class="spec-item">
                                    <i class="fas fa-building"></i>
                                    <span>${t.floor} ${prop.floor || '-'}</span>
                                </div>
                                <div class="spec-item">
                                    <i class="fas fa-vector-square"></i>
                                    <span>${prop.area || '-'} ${t.area}</span>
                                </div>
                                <div class="spec-item">
                                    <i class="fas fa-bed"></i>
                                    <span>${prop.bedrooms || '-'} ${t.rooms}</span>
                                </div>
                                <div class="spec-item">
                                    <i class="fas fa-bath"></i>
                                    <span>${prop.bathrooms || '-'} ${t.baths}</span>
                                </div>
                            </div>

                            <div class="btn-group">
                                ${videoBtnHTML}
                                <a href="https://wa.me/${phone}?text=${waMessage}" target="_blank" class="action-btn whatsapp">
                                    <i class="fab fa-whatsapp" style="font-size: 1.2rem;"></i> ${t.waBtn}
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                gridContainer.innerHTML += cardHTML;
            });
            
            document.querySelectorAll('.slider').forEach(s => {
                if(currentLang === 'ar') {
                    s.scrollLeft = s.scrollWidth;
                }
            });
        }

        function openLightbox(galleryKey, startIndex) {
            currentGalleryKey = galleryKey;
            currentImageIndex = startIndex;
            updateLightboxImage();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto'; 
            setTimeout(() => { lightboxImg.src = ""; }, 300); 
        }

        function navigateLightbox(direction) {
            if (!currentGalleryKey) return;
            const images = galleries[currentGalleryKey];
            currentImageIndex += direction;

            if (currentImageIndex >= images.length) currentImageIndex = 0;
            if (currentImageIndex < 0) currentImageIndex = images.length - 1;

            updateLightboxImage();
        }

        function updateLightboxImage() {
            const images = galleries[currentGalleryKey];
            lightboxImg.src = images[currentImageIndex];
            lightboxCounter.textContent = `${currentImageIndex + 1} / ${images.length}`;
        }

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox || e.target.classList.contains('lightbox-content')) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if(currentLang === 'ar') {
                if (e.key === 'ArrowRight') navigateLightbox(-1); 
                if (e.key === 'ArrowLeft') navigateLightbox(1);   
            } else {
                if (e.key === 'ArrowRight') navigateLightbox(1); 
                if (e.key === 'ArrowLeft') navigateLightbox(-1); 
            }
        });

        window.scrollSlider = function(btn, direction) {
            const slider = btn.parentElement.querySelector('.slider');
            const scrollAmount = slider.clientWidth;
            const scrollDir = currentLang === 'ar' ? -direction : direction;
            slider.scrollBy({ left: (scrollAmount * scrollDir), behavior: 'smooth' });
        }

        function filterProperties() {
            const selectedPhase = phaseFilter.value;
            const selectedFloor = floorFilter.value;
            const selectedRooms = roomsFilter.value;
            const selectedBaths = bathsFilter.value;
            
            const inputArea = parseInt(areaFilter.value) || 0;
            const inputPrice = parseInt(priceFilter.value) || 0;

            const filtered = allProperties.filter(prop => {
                const matchPhase = selectedPhase === 'all' || String(prop.phase) === String(selectedPhase);
                const matchFloor = selectedFloor === 'all' || String(prop.floor) === String(selectedFloor);
                const matchRooms = selectedRooms === 'all' || parseInt(prop.bedrooms) === parseInt(selectedRooms);
                const matchBaths = selectedBaths === 'all' || parseInt(prop.bathrooms) === parseInt(selectedBaths);

                let matchArea = true;
                if (inputArea > 0 && prop.area) {
                    const diff = Math.abs(parseInt(prop.area) - inputArea);
                    matchArea = diff <= (inputArea * 0.15);
                }

                let matchPrice = true;
                if (inputPrice > 0 && prop.price) {
                    matchPrice = parseInt(prop.price) <= (inputPrice * 1.05);
                }

                return matchPhase && matchFloor && matchRooms && matchBaths && matchArea && matchPrice;
            });

            renderProperties(filtered);
        }

        phaseFilter.addEventListener('change', filterProperties);
        floorFilter.addEventListener('change', filterProperties);
        roomsFilter.addEventListener('change', filterProperties);
        bathsFilter.addEventListener('change', filterProperties);
        areaFilter.addEventListener('input', filterProperties);
        priceFilter.addEventListener('input', filterProperties);

        window.addEventListener('DOMContentLoaded', fetchProperties);
    </script>
</body>
</html>
